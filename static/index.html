<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobScanner – AI Resume Automation</title>

    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="/static/favicon.ico">
</head>

<body>

<div class="container">

    <h1>🚀 JobScanner – AI Resume Automation</h1>


    <!-- ========================= -->
    <!-- USER PROFILE SECTION -->
    <!-- ========================= -->

    <h2>👤 Your Profile</h2>

    <label>Full Name</label>
    <input type="text" id="name" placeholder="John Doe" />

    <label>Email</label>
    <input type="email" id="email" placeholder="john@email.com" />

    <label>LinkedIn</label>
    <input type="text" id="linkedin" placeholder="https://linkedin.com/in/username" />

    <label>GitHub</label>
    <input type="text" id="github" placeholder="https://github.com/username" />

    <label>Years of Experience</label>
    <input type="number" id="experience" placeholder="2" />

    <!-- ========================= -->
    <!-- INTEREST SECTION -->
    <!-- ========================= -->

    <h2>🎯 Job Interest</h2>

    <label>Enter Your Interest</label>
    <input type="text" id="interest" placeholder="Cyber Security Analyst" />

    <div class="button-group">
        <button id="autoGenerateBtn">🤖 Auto Generate Resume</button>
        <button id="downloadBtn">⬇ Download Resume</button>
    </div>

    <p id="status"></p>

    <!-- ========================= -->
    <!-- JOB INFO -->
    <!-- ========================= -->

    <div id="jobInfoBox" class="job-box"></div>

    <!-- ========================= -->
    <!-- ATS SCORE -->
    <!-- ========================= -->

    <h3>📊 ATS Score</h3>
    <div id="atsScore" class="ats-box">--</div>

    <!-- ========================= -->
    <!-- RESUME EDITOR -->
    <!-- ========================= -->

    <h3>📝 Edit Resume</h3>
    <textarea id="resumeEditor" rows="20"></textarea>

    <div class="button-group">
        <button id="updateResumeBtn">🔄 Update & Recalculate ATS</button>
    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
